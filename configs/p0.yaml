preprocess:
  hu_min: -1000.0
  hu_max: 400.0
  median_size: 3
lung:
  threshold_hu: -400.0
  min_component_area_mm2: 50.0
  keep_n_largest: 2
  trachea_max_area_mm2: 600.0
  trachea_center_band: 0.1
  min_3d_fraction: 0.05
  closing_radius_mm: 10.0
candidates:
  r_min_mm: 1.5
  r_max_mm: 15.0
  n_scales: 10
  log_threshold: 0.1
  mask_outside: true
  grow_hu: -600.0
  grow_margin: 1.5
  min_blob_diameter_mm: 1.5
  max_blobs_per_slice: 80
  fallback_disc: false
  center_from_log: true
  clip_region_factor: 1.5
tracking:
  gate_min_mm: 3.0
  gate_radius_frac: 0.5
  max_gap: 1
  gap_penalty_mm: 1.0
features:
  min_fit_slices: 3
  sphere_radius_tolerance: 1.3
classifier:
  aspect_thresh: 2.5
  aspect_scale: 0.3
  drift_thresh: 1.0
  drift_scale: 0.2
  sphere_center: 0.0
  sphere_scale: 0.05
  neutral_sphere_score: 0.5
  diam_min_mm: 3.0
  diam_max_mm: 30.0
  min_slices: 2
  branch_scale: 0.5
  rules:
  - aspect
  - drift
  - sphere
  - size
  - min_slices
  - dot  # 2D Hessian dot-vs-line (Li, Sone & Doi 2003); log_strength is optional
  accept_threshold: 0.5
